# ============================================================
#  업종 프로필 — 대출중개 (더스틴홀딩스)
#  엔진(오케스트레이터·채널·승인·대시보드)은 그대로 두고 이 파일만 갈아끼운다.
#  전환:  .env 의 AUTOAD_PROFILE=loan
# ============================================================
key: loan
name: 대출중개 (더스틴홀딩스)

brand:
  company: "(주)더스틴홀딩스대부중개"
  roman: "DUSTIN HOLDINGS"
  phone: "010-4649-5078"
  region: "대구·경북·전국 비대면"
  channels: "카카오톡·텔레그램 상담 가능"
  registered: "정식등록업체"
  site: ""                 # 오프라인 상담 업종 → 전화번호로 유도
  reg_no: ""          # ⚠ 대부중개업 등록번호 — 신규 소재 생성 시 필요

compliance:
  # 모든 소재 하단에 고정으로 찍히는 문구 (AI에게 맡기지 않는다)
  disclaimer: "※ 대출은 심사 기준에 따라 한도 및 금리가 달라질 수 있으며, 대출 실행이 보장되는 것은 아닙니다."
  # 카피에 나오면 재생성시키는 확정·과장 표현
  banned_phrases:
    - "무조건"
    - "100% 승인"
    - "100%승인"
    - "누구나 대출"
    - "누구나 가능"
    - "즉시 승인 보장"
    - "승인 보장"
    - "최저금리 보장"
    - "무심사"
    - "묻지마"
  # 카피 프롬프트에 주입되는 업종 주의사항
  note: "대부업법·금융소비자보호법상 의무표기·광고심의 대상. 확정·과장 표현 금지."

content:
  source: flyers                       # flyers(기성 전단 재사용) | docs(설명서에서 생성)
  flyers_dir: content/templates/flyers
  docs_dir: ""

# 카피 생성이 실패했을 때 쓰는 안전 문구
fallback_copy:
  body: "보유 자산의 가치를 활용한 금융 솔루션. {region} 상담 가능합니다. 추가자금·대환·후순위까지 검토해 드립니다."

intake:
  title: "대출 상담 접수"
  target: loan_app                     # loan_app(대출앱 register) | none

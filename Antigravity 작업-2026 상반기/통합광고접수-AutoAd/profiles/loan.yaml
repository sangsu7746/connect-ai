# ============================================================
#  업종 프로필 — 대출중개 (더스틴홀딩스)
#  엔진(오케스트레이터·채널·승인·대시보드)은 그대로 두고 이 파일만 갈아끼운다.
#  전환:  .env 의 AUTOAD_PROFILE=loan
# ============================================================
key: loan
name: 대출중개 (더스틴홀딩스)

# 이 업종 광고를 내보낼 수 있는 플랫폼. 비우면 제한 없음.
# ⚠ 대출 광고는 밴드·페이스북에만 나간다(운영자 지시). 쓰레드·카카오로는
#   내보내지 않는다 — 목록에 없는 플랫폼은 발행 직전에 차단된다.
allow_platforms: [band, facebook]

brand:
  company: "(주)더스틴홀딩스대부중개"
  roman: "DUSTIN HOLDINGS"
  # 대부업법 제9조상 광고에 실어야 하는 '등록된 광고용 전화번호'.
  # ⚠ 2026-01-05자 대부중개업 등록증의 '광고용전화번호' 란에는 010-7697-5684 가
  #   기재돼 있다. 운영자 확인에 따라 아래 번호를 법인 광고등록 번호로 사용한다.
  #   등록증 기재값과 다르므로, 변경등록이 되어 있는지 별도 확인이 필요하다.
  # content/templates/flyers/ 의 원본 전단 15장에는 구번호 010-4649-5078 이
  #   인쇄돼 있다. 2026-08-07 그 27곳을 아래 번호로 교체한 flyers_v2 를 만들어
  #   content.flyers_dir 이 그쪽을 보게 했다. 원본은 보존용으로만 남긴다.
  phone: "010-2577-2679"
  region: "대구·경북·전국 비대면"
  channels: "카카오톡·텔레그램 상담 가능"
  registered: "정식등록업체"
  site: ""                 # 오프라인 상담 업종 → 전화번호로 유도
  # 대부중개업 등록번호 (등록증 실물 확인, 2026-01-05자)
  reg_no: "2026-대구중구-0002"

compliance:
  # 모든 소재 하단에 고정으로 찍히는 문구 (AI에게 맡기지 않는다)
  disclaimer: "※ 대출은 심사 기준에 따라 한도 및 금리가 달라질 수 있으며, 대출 실행이 보장되는 것은 아닙니다."

  # ── 대부업법 제9조 필수기재사항 ──────────────────────────
  # 근거: 대부업법 제9조 + 시행령 제6조의2 + [별표1] 대부업자 등의 광고 표시기준
  # ⚠ 이 블록은 **대부중개업 전용**이다. 다른 업종 프로필은 이 키를 갖지 않으며,
  #   갖지 않은 프로필에는 아무 문구도 붙지 않는다(content/disclosure.py).
  #   여기 있는 값을 config.DISCLAIMER 로 옮기지 말 것 — DISCLAIMER 는
  #   showcase/stamp_contact_band 를 통해 13개 docs 업종 전부에 새어 나간다.
  mandatory:
    # 등록 정보 (대부중개업 등록증 실물, 2026-01-05자)
    reg_authority: "대구광역시 중구청"
    reg_authority_tel: "053-661-2655"       # 경제과
    reg_valid_from: "2024-01-08"
    reg_valid_to: "2027-01-08"
    address: "대구광역시 중구 공평로 105, 노마즈하우스 10층 1014호 (교동)"

    # ⚠⚠ 아래 네 값은 **운영자가 채워야 한다. 지어내면 안 된다.**
    #   비어 있는 동안 loan 소재는 생성·발행이 모두 차단된다
    #   (config.compliance_gaps / orchestrator.run_campaign).
    #   · interest_rate   : 중개하는 상품의 연 이자율 범위. 반드시 '연 환산' 표기.
    #                       법정최고 연 20%. 예) "연 5.9% ~ 연 20.0% (연 환산 기준)"
    #                       ⚠ 값에 '연' 이 없으면 게이트가 거부한다(월 이자율만
    #                         적는 것은 법 제9조제3항제3호 위반).
    #   · overdue_rate    : 연체이자율. 법 제9조제3항제3호가 대부이자율과 **함께**
    #                       요구한다. 역시 연 환산. 예) "연 20.0% (연 환산 기준)"
    #   · extra_costs     : 대부계약과 관련된 부대비용. 근저당설정비·인지대 등.
    #                       없으면 "없음" 이라고 명시해야 한다(공란은 미표기다).
    #   · early_repayment : 조기상환수수료율 등 조기상환조건(법 제9조제3항제5호).
    #                       없으면 "조기상환수수료 없음" 처럼 명시할 것.
    interest_rate: "연 20% 이내 (연 환산 기준)"
    overdue_rate: "연 20% (연 환산 기준)"
    extra_costs: "없음"
    early_repayment: "조기상환수수료 없음"

    # ── 법정 지정문구 ──────────────────────────────────────
    # ⚠ 시행령 [별표1] 2.가 는 아래 문장을 **지정**한다. 한 글자도 바꾸지 말 것.
    #   허용 문장 목록은 content/disclosure.py 의 STANDARD_* 에 있고, 목록 밖
    #   문자열을 넣으면 gaps() 가 잡아 발행이 차단된다.
    #   (이전 판본은 "...큰 불행을 가져올 수 있습니다." 라는 **비지정 문장**을
    #    쓰고 있었다. 지정문구 미사용은 미표기로 다투어질 수 있다.)
    overborrow_warning: "과도한 빚은 당신에게 큰 불행을 안겨 줄 수 있습니다."
    # 신용등급 하락 가능성 경고문구(법 제9조제3항제6호 후단). 아래 대신
    #   "대출 시 신용등급 하락으로 다른 금융거래가 제약받을 수 있습니다."
    # 를 써도 된다(둘 다 [별표1] 2.가 지정문구다). 운영자 선택 사항.
    credit_warning: "대출 시 귀하의 신용등급이 하락할 수 있습니다."
    broker_fee_notice: "중개수수료를 요구하거나 받는 것은 불법입니다."

    # ⚠⚠ 기성 전단에 인쇄된 전화번호가 '등록된 광고용 전화번호'와 일치하는가.
    #   false 인 동안 loan 소재는 생성·발행이 차단된다.
    #
    #   2026-08-07 true 로 변경. 근거:
    #     · 운영자가 010-2577-2679 를 등록 광고용 전화번호로 확인했다
    #       (brand.phone 과 같은 값).
    #     · 구 전단 15장에 인쇄돼 있던 구번호 010-4649-5078 27곳을 전부
    #       010-2577-2679 로 교체해 content/templates/flyers_v2/ 에 만들었고,
    #       아래 content.flyers_dir 이 그 디렉터리를 가리킨다.
    #       (교체 도구: tools/fix_flyer_phone.py, 27곳 전수 육안 확인 완료.
    #        배너 2장은 한 장에 번호가 8개/6개라 27곳이다.)
    #     · 원본 15장은 content/templates/flyers/ 에 그대로 보존돼 있다.
    #   ⚠ flyers_dir 을 flyers 로 되돌리면 구번호 전단이 다시 나가므로,
    #     되돌릴 때는 이 플래그도 반드시 false 로 함께 내릴 것.
    flyer_phone_verified: true

  # 발행 전 반드시 채워져 있어야 하는 의무표기 항목.
  # 이 목록이 비었거나 없는 프로필은 의무표기 자체가 적용되지 않는다(무회귀).
  # company 는 brand.company, reg_no 는 brand.reg_no, ad_phone 은 brand.phone.
  # ⚠ 법 제9조제3항 각 호 + 시행령 제6조제3항 **전 항목**이다. 여기서 항목을
  #   빼면 그만큼이 광고에서 빠진 채 '법정 필수 표기' 머리표만 달고 나간다.
  mandatory_required:
    - company
    - reg_no
    - interest_rate
    - overdue_rate
    - extra_costs
    - early_repayment
    - overborrow_warning
    - credit_warning
    - address
    - ad_phone
    - reg_authority
    - reg_authority_tel
    - broker_fee_notice
  # 카피에 나오면 재생성시키는 확정·과장 표현
  banned_phrases:
    - "무조건"
    - "100% 승인"
    - "100%승인"
    - "누구나 대출"
    - "누구나 가능"
    - "즉시 승인 보장"
    - "승인 보장"
    - "최저금리 보장"
    - "무심사"
    - "묻지마"
  # 카피 프롬프트에 주입되는 업종 주의사항
  note: "대부업법·금융소비자보호법상 의무표기·광고심의 대상. 확정·과장 표현 금지."

content:
  source: flyers                       # flyers(기성 전단 재사용) | docs(설명서에서 생성)
  # ⚠ flyers_v2 = 인쇄 전화번호를 등록 광고용 번호(010-2577-2679)로 교체한 판.
  #   원본(구번호 010-4649-5078)은 content/templates/flyers/ 에 보존돼 있다.
  #   여기를 flyers 로 되돌리면 미등록 번호가 그대로 발행되므로,
  #   되돌릴 때는 compliance.mandatory.flyer_phone_verified 도 false 로 내릴 것.
  flyers_dir: content/templates/flyers_v2
  docs_dir: ""

# 카피 생성이 실패했을 때 쓰는 안전 문구
fallback_copy:
  body: "보유 자산의 가치를 활용한 금융 솔루션. {region} 상담 가능합니다. 추가자금·대환·후순위까지 검토해 드립니다."

intake:
  title: "대출 상담 접수"
  target: loan_app                     # loan_app(대출앱 register) | none

# ============================================================
#  업종 프로필 — NailPreview (네일 미리보기 앱)
#  대출과 전혀 다른 업종. 기성 전단이 없고 '제품 설명서'에서 소재를 만든다.
#  전환:  .env 의 AUTOAD_PROFILE=nailpreview
# ============================================================
key: nailpreview
name: NailPreview (네일 미리보기 앱)

brand:
  company: headjim.com
  roman: "NailPreview"
  phone: ""                     # 앱 서비스라 전화 없음 — 비우면 소재에 안 찍힘
  region: "전국 온라인"
  channels: "앱에서 바로 이용"
  registered: ""
  # 웹/앱 서비스 → 전화 대신 사이트 주소로 유도 (전화번호가 없어도 됨)
  site: "headjim-web.web.app"
  reg_no: ""

compliance:
  # 대출 같은 법정 의무표기는 없다. 다만 AI 결과물이라는 점은 밝힌다.
  disclaimer: "※ 미리보기는 AI가 생성한 예상 이미지로, 실제 시술 결과와 다를 수 있습니다."
  banned_phrases:
    - "무조건"
    - "100% 똑같"
    - "부작용 없"
    - "영구"
    - "치료"                     # 의료 표현 — 미용 서비스에서 금지
  note: "미용 서비스. 의료·치료 효과를 암시하는 표현 금지(의료법). 결과는 개인차 있음을 전제로."

content:
  source: docs                  # 설명서(PDF)에서 광고 소재를 생성
  flyers_dir: ""
  docs_dir: "D:/headjim AI-LAB-Template/docs/광고홍보서"

fallback_copy:
  body: "시술 전에 내 손에 먼저 올려보세요. AI가 손톱 모양과 피부톤을 인식해 미리 보여드립니다."

intake:
  title: "서비스 문의"
  target: none                  # 대출앱으로 보내지 않는다 (수신함에만 쌓임)

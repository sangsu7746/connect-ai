# ============================================================
#  새 업종 추가 템플릿
#  1) 이 파일을 profiles/{내업종}.yaml 로 복사
#  2) 아래 값을 채움
#  3) .env 에 AUTOAD_PROFILE={내업종}
#  → 엔진(채널·승인·대시보드·접수)은 손댈 필요 없음
# ============================================================
key: myindustry              # 파일명과 같게
name: 표시용 이름 (예: 인테리어 시공)

brand:
  company: "회사명"          # 소재 하단에 찍힘. 없으면 "" (안 찍힘)
  roman: ""
  phone: "010-0000-0000"     # 없으면 "" (안 찍힘)
  region: "서울·경기"
  channels: "카카오톡 상담 가능"
  registered: ""             # "정식등록업체" 처럼 신뢰 표시가 있으면
  # 웹/앱 서비스면 사이트 주소를 크게 노출(전화 대신). 오프라인이면 "" 로 두고 phone 사용
  site: ""
  reg_no: ""                 # 법정 등록번호가 필요한 업종만

compliance:
  # 모든 소재 하단에 고정으로 찍는 문구. AI 에게 맡기지 않으므로 오타가 날 수 없다.
  # 법정 의무표기가 없는 업종이면 "결과는 개인차가 있습니다" 같은 안내면 충분. 없으면 ""
  disclaimer: "※ 안내 문구"
  # 카피에 나오면 자동 재생성시킬 표현. 업종 규제에 맞춰 적는다.
  #   대출=확정·과장 / 미용·건강=의료 표현 / 식품=효능 표현
  banned_phrases:
    - "무조건"
    - "100%"
  # 카피 프롬프트에 그대로 주입되는 한 줄. 업종 규제 요약.
  note: "업종 주의사항 한 줄 (예: 의료 효과 암시 금지)"

content:
  # flyers = 이미 만들어둔 전단 이미지를 재사용 (오타 위험 0, 가장 안전)
  # docs   = 제품 설명서(PDF)에서 광고 소재를 생성 (전단이 없을 때)
  source: docs
  flyers_dir: ""             # source=flyers 일 때 전단 폴더
  docs_dir: ""               # source=docs 일 때 설명서 폴더

fallback_copy:
  # AI 카피 생성이 실패했을 때 쓰는 안전 문구. {region} 사용 가능.
  body: "핵심 소개 한두 문장. {region} 상담 가능합니다."

intake:
  title: "상담 접수"
  # loan_app = 대출앱으로 전달 / none = 클라우드 수신함에만 쌓임
  target: none

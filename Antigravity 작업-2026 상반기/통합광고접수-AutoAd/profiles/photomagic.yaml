intake:
  title: "서비스 문의"
  target: none                   # 대출앱으로 보내지 않음 (클라우드 수신함에만)

threads:
  interest_keywords:
    - 사진
    - 셀카
    - 프로필사진
    - 보정
    - 인생네컷
    - 증명사진
    - 포토샵
    - 필터
    - 화질
    - 흑백
  hard_block:
  # ------------------------------------------------------------------
  # hard_block 원칙 (Task 8 골든셋 리뷰 2라운드에서 확정):
  #   이 목록은 기본이 "넓게 잡고 과차단을 감수한다"이다. 좁히는 시도는
  #   1라운드에서 "삼가 조의"/"정당 지지"/"고소장" 같은 공백 결합 bigram과
  #   특정 활용형으로 좁혔다가, 리뷰어가 조사가 붙은 자연스러운 문장
  #   ("삼가 명복을 빕니다", "고소했던 사건", "지지하는 정당")으로 전부
  #   뚫어냈다 - 한국어는 조사가 명사에 바로 붙고 활용형이 다양해서, 내가
  #   고른 몇 개 구문으로는 절대 다 못 막는다. 그 중 실제로 안전하게
  #   좁힐 수 있었던 건 "사고"(事故) 하나뿐이었다 - "사고 싶다"(사다+
  #   고싶다)는 우리 타깃 오디언스(사진 서비스 잠재고객)의 핵심 어휘에서
  #   압도적으로 흔하고, 진짜 사고 표현은 뒤에 붙는 말이 너무 다양해
  #   좁히면 놓칠 게 뻔했다. 나머지는 전부 넓게 유지하고, 과차단이 실제로
  #   얼마나 기회비용을 만드는지는 좁히지 않고 그대로 골든셋으로 측정한다
  #   (tests/fixtures/sample_posts.json 에 reply 라벨 + 과차단 케이스로
  #   기록 - 리포트의 미탐(false_neg) 수치가 이 비용이다).
  #
  #   과차단을 감수하는 이유: 놓치면(under-block) 부고/투병 글에 광고가
  #   붙는다 - 이 시스템이 존재하는 이유 자체를 깨는 사고. 과차단하면
  #   (over-block) 잠재고객 하나를 놓친다 - 피드는 매시간 더 만들어낸다.
  #   비대칭이 크다.
  # ------------------------------------------------------------------
    - 부고
    - 삼가
    # 명복: "명복을 빕니다"는 거의 예외 없이 조의 표현에서만 쓰인다(1라운드
    # 리뷰에서 "삼가 명복을 빕니다"가 좁힌 "삼가" 목록을 통과한 사례로
    # 지적됨 - "삼가" 없이 "고인의 명복을 빕니다"만 오는 글도 잡기 위해
    # 별도 단어로 추가).
    - 명복
    - 조의
    # 빈소/발인/부의금: 조의 표현이 "삼가"/"명복" 둘 다 없이 오는 경우
    # (예: "발인이 내일이라 정신이 없어요")까지 잡기 위한 보강.
    - 빈소
    - 발인
    - 부의금
    - 사고
    - 확진
    - 투병
    # 임종/항암/중환자실: 부고 직전 단계(질병·죽음)를 잡기 위한 보강 -
    # 일상 어휘에서 다른 뜻으로 거의 안 쓰인다.
    - 임종
    - 항암
    - 중환자실
    - 수술
    - 고소
    - 소송
    # 기소/압수수색: 고소/소송보다 더 무거운 법적 상황 - 일상 어휘에서
    # 다른 뜻으로 안 쓰인다.
    - 기소
    - 압수수색
    - 정당
    - 대선
    - 시위
    - 사망
  landing: "https://headjim-photomagic.web.app"
  brand: "PhotoMagic"

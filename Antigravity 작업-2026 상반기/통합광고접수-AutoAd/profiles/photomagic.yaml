# ============================================================
#  업종 프로필 — PhotoMagic (사진 변환)
#  홍보서에서 자동 생성 (URL 은 홍보서에 적힌 주소, 접속 확인 완료)
#  전환:  .env 의 AUTOAD_PROFILE=photomagic
# ============================================================
key: photomagic
name: "PhotoMagic (사진 변환)"

brand:
  company: headjim.com
  roman: ""
  phone: ""                      # 웹 서비스 → 전화 대신 site 로 유도
  region: "전국 온라인"
  channels: "웹에서 바로 이용"
  registered: ""
  site: "headjim-photomagic.web.app"
  reg_no: ""

compliance:
  disclaimer: "※ AI가 생성한 결과물로, 실제와 다를 수 있습니다."
  banned_phrases:
    - "무조건"
    - "100%"
    - "완벽하게"
    - "절대"
  note: "사진 변환. 원본 훼손·복원 보장 표현 금지."

content:
  source: docs                   # 기성 전단이 없으므로 홍보서에서 소재 생성
  flyers_dir: ""
  docs_dir: "D:/headjim AI-LAB-Template/docs/광고홍보서"
  doc: "PhotoMagic — 사진 변환 광고홍보서.pdf"                   # 이 업종의 기본 설명서

fallback_copy:
  body: "PhotoMagic — 자세한 내용은 headjim-photomagic.web.app 에서 확인하세요."

intake:
  title: "서비스 문의"
  target: none                   # 대출앱으로 보내지 않음 (클라우드 수신함에만)

threads:
  interest_keywords:
    - 사진
    - 셀카
    - 프로필사진
    - 보정
    - 인생네컷
    - 증명사진
    - 포토샵
    - 필터
    - 화질
    - 흑백
  hard_block:
    - 부고
    # 삼가: "삼가 조의를 표합니다"의 정중어법과 "사진 촬영은 삼가주세요"
    # 같은 일반 안내문이 같은 두 글자로 충돌한다(Task 8 골든셋 리뷰에서
    # 실측 확인). 한국어 조의 표현은 고정된 정형구라 좁혀도 놓칠 위험이
    # 낮다 - "삼가 조의"/"삼가 고인"으로 좁힌다.
    - 삼가 조의
    - 삼가 고인
    - 조의
    - 사고
    - 확진
    - 투병
    - 수술
    # 고소: "고소하다"가 (1)소송을 걸다 (2)맛이 고소하다(참기름 등)
    # (3)남의 불행이 고소하다(쌤통) 세 가지 뜻의 동음이의어라 바른 단어
    # 자체로는 못 좁힌다. 법률 맥락에서만 쓰이는 복합어로 좁힌다.
    - 고소장
    - 고소인
    - 고소당
    - 고소하겠다
    - 고소하려고
    - 형사고소
    - 무고죄
    - 소송
    # 정당: "정당하다/정당한"(타당하다는 뜻의 형용사)과 명사 "정당"(정치
    # 조직)이 충돌한다(Task 8 골든셋 리뷰: "이 가격이 정당한가요"가 걸림).
    # 실제 캐주얼한 정치 언급은 "여당/야당"이나 "정당 지지/후보/소속" 형태로
    # 훨씬 자주 나타나므로 이 형태들로 좁힌다.
    - 정당 지지
    - 정당 후보
    - 정당 소속
    - 여당
    - 야당
    # 대선: "대선"(대통령 선거)과 "대선배"(손윗 선배), "대선"(소주 브랜드)이
    # 충돌한다(Task 8 골든셋 리뷰). 선거 관련 캐주얼 언급이 자주 취하는
    # 형태로 좁힌다.
    - 대선 후보
    - 대선 정국
    - 대선 토론
    - 이번 대선
    - 대선 유세
    # 시위: "시위"(집회/데모)와 "시위"(활시위, 국궁) - 완전한 동음이의어다.
    # 좁히려면 "시위대"/"거리시위" 등으로 갈 수 있지만, 실제 집회 글은
    # "시위 현장"/"1인시위"/"촛불시위" 등 형태가 다양해 좁힌 목록이 놓칠
    # 위험이 사고(事故)보다도 크다고 판단해 넓게 유지한다(과차단 감수 -
    # Task 8 골든셋 리뷰 대응 참고. 활시위 충돌 사례는
    # tests/fixtures/sample_posts.json 에 reply 라벨로 기록해 미탐으로
    # 드러나게 해뒀다).
    - 시위
    - 사망
    # 사고(事故): "사고 나다/사고 현장/교통사고" 같은 진짜 사고 표현은
    # 명사 뒤에 붙는 말이 너무 다양해(현장/사진/영상/소식/났다/났어요/
    # 당하다/나서...) 몇 개 구문으로 안전하게 좁힐 수 없었다. 반면
    # "사고 싶다"(사다+고싶다) 충돌은 확인됐다(Task 8 골든셋 리뷰: "폰카
    # 사고 싶은데"가 걸림). 좁혔다가 진짜 사고 글을 놓치는 쪽이 이
    # 시스템이 절대 저지르면 안 되는 사고이므로, 과차단을 감수하고 넓게
    # 유지한다(accepted over-blocking). "사고 싶다" 충돌 사례는
    # tests/fixtures/sample_posts.json 에 reply 라벨로 기록해 미탐으로
    # 드러나게 해뒀다.
  landing: "https://headjim-photomagic.web.app"
  brand: "PhotoMagic"

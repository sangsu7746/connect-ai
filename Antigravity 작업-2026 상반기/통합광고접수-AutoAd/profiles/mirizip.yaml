content:
  source: docs                   # 기성 전단이 없으므로 홍보서에서 소재 생성
  flyers_dir: ""
  docs_dir: "D:/headjim AI-LAB-Template/docs/광고홍보서"
  doc: "미리집 — 우리집 인테리어 미리보기 광고홍보서.pdf"                   # 이 업종의 기본 설명서

fallback_copy:
  body: "미리집 — 자세한 내용은 mirizip.com 에서 확인하세요."

intake:
  title: "서비스 문의"
  target: none                   # 대출앱으로 보내지 않음 (클라우드 수신함에만)

# ============================================================
#  쓰레드 답글 자동광고 (threads/ 파이프라인)
#  · 추천 피드에서 이 키워드가 있는 글을 1차로 고르고, LLM 이 2차 판정한다.
#  · 실측 피드(2026-08-04) 기준: 인테리어 시공사·집꾸미기 계정이 주류.
# ============================================================
threads:
  # 관심 키워드는 넉넉하게 잡는다. 여기서 잘못 걸려도 LLM 이 다시 거르지만,
  # 여기서 안 걸리면 그 글은 영영 못 본다. hard_block 과 정반대 원칙이다.
  #
  # ⚠ 실측(2026-08-04 추천 피드 5건)에서 배운 것:
  #   인테리어 계정은 '인테리어' 라는 단어를 잘 안 쓴다. 사진이 본체고
  #   텍스트는 짧은 캡션이라 "카운터 세면대가 가능할 때" / "오늘 첨거시작
  #   현장" 같은 식이다. 그래서 상위 개념어(인테리어·리모델링)만으로는
  #   절반도 못 잡는다 — 실제로 쓰는 설비·자재·공간·공정 어휘까지 넣는다.
  interest_keywords:
    # 상위 개념
    - 인테리어
    - 집꾸미기
    - 집스타
    - 방꾸미기
    - 셀프인테리어
    - 리모델링
    - 리폼
    - 홈스타일링
    # 공정·현장 (시공사 계정이 실제로 쓰는 말)
    - 시공
    - 현장
    - 철거
    - 첨거          # 철거의 업계 표기 변형
    - 착공
    - 준공
    - 도배
    - 페인팅
    - 필름
    - 마감재
    - 견적
    - 평수
    # 공간
    - 거실
    - 주방
    - 침실
    - 욕실
    - 화장실
    - 현관
    - 베란다
    - 발코니
    - 드레스룸
    - 서재
    - 다용도실
    - 전실
    # 설비·자재 (세면대·타일처럼 캡션에 바로 나오는 말)
    - 세면대
    - 싱크대
    - 상부장
    - 하부장
    - 붙박이장
    - 수납장
    - 수납
    - 중문
    - 파티션
    - 아트월
    - 몰딩
    - 걸레받이
    - 타일
    - 벽지
    - 바닥재
    - 마루
    - 우드
    - 조명
    - 간접등
    - 다운라이트
    - 콘센트
    # 가구·소품
    - 가구
    - 소파
    - 침대
    - 식탁
    - 커튼
    - 블라인드
    - 러그
    - 홈카페
    - 인테리어소품
    # 상황 (이사·입주 시점이 전환이 가장 잘 되는 구간)
    - 신혼집
    - 전셋집
    - 원룸
    - 자취방
    - 아파트
    - 빌라
    - 오피스텔
    - 이사
    - 입주
    - 집들이

  # hard_block 원칙: 넓게 잡고 과차단을 감수한다.
  # 놓치면(under-block) 부고·투병 글에 광고가 붙는다 - 되돌릴 수 없다.
  # 과차단하면(over-block) 잠재고객 하나를 놓친다 - 피드는 매시간 더 만든다.
  # 목록은 photomagic 과 동일하다. 업종이 달라도 '광고를 달면 안 되는 글'은 같다.
  #
  # ⚠ 이 업종 특유의 과차단 하나: '사고'(事故) 가 "사고 싶다" 를 막는다.
  #   인테리어 피드에서 "이 가구 사고 싶다" 는 아주 흔하고, 그건 좋은 타깃이다.
  #   그래도 좁히지 않는다 - 진짜 사고 표현은 뒤에 붙는 말이 너무 다양해서
  #   좁히면 놓칠 게 확실하고, 놓쳤을 때의 대가가 비대칭적으로 크다.
  #   실제 손실량은 골든셋 미탐 수치로 측정해서 그때 다시 판단한다.
  hard_block:
    - 부고
    - 삼가
    - 명복
    - 조의
    - 빈소
    - 발인
    - 부의금
    - 사고
    - 확진
    - 투병
    - 임종
    - 항암
    - 중환자실
    - 수술
    - 고소
    - 소송
    - 기소
    - 압수수색
    - 정당
    - 대선
    - 시위
    - 사망

  # 답글에 들어갈 링크. brand.site 는 스킴이 없어(mirizip.com) 그대로 쓰면
  # 링크로 안 걸리므로 여기서 전체 주소로 명시한다.
  # ⚠ /t/ 짧은 추적 경로는 쓰지 않는다 - mirizip.com 에 rewrite 가 없어
  #   광고를 누른 사람이 404 를 본다(실측 확인됨).
  landing: "https://mirizip.com"
  brand: "미리집"

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>대출 상담 접수 | (주)더스틴홀딩스대부중개</title>
<style>
  :root{--accent:#0C7C74;--ink:#16202A;--line:#dfe5e6;--muted:#5a6672}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    background:#f4f7f7;color:var(--ink);line-height:1.6}
  .card{max-width:440px;margin:24px auto;background:#fff;border:1px solid var(--line);
    border-radius:16px;padding:26px 22px}
  h1{font-size:1.3rem;margin:0 0 4px}
  .sub{color:var(--muted);font-size:.9rem;margin:0 0 20px}
  label{display:block;font-size:.85rem;font-weight:700;margin:14px 0 5px}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:1rem}
  .consent{display:flex;gap:9px;align-items:flex-start;margin:18px 0 6px;
    background:#f4f7f7;border-radius:10px;padding:12px}
  .consent input{width:auto;margin-top:3px}
  .consent small{font-size:.78rem;color:var(--muted)}
  button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;
    background:var(--accent);color:#fff;font-size:1.02rem;font-weight:700;cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}
  .err{color:#b24336;font-size:.85rem;margin-top:10px;display:none}
  .note{font-size:.72rem;color:var(--muted);margin-top:14px;text-align:center}
  .brand{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
    font-size:.75rem;color:var(--muted);text-align:center;line-height:1.7}
  /* 봇 차단용 — 사람에게 보이지 않음 */
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
  <form class="card" id="f" autocomplete="off" novalidate>
    <h1>대출 상담 접수</h1>
    <p class="sub">아래 정보를 남겨주시면 상담원이 연락드립니다.</p>

    <label for="name">이름</label>
    <input id="name" name="name" required maxlength="20">

    <label for="phone">연락처</label>
    <input id="phone" name="phone" required inputmode="tel" placeholder="010-0000-0000" maxlength="20">

    <label for="amount">희망 금액</label>
    <input id="amount" name="amount" placeholder="예: 3,000만원" maxlength="30">

    <label for="collateral">담보 유무</label>
    <select id="collateral" name="collateral">
      <option value="">선택</option>
      <option value="부동산담보">부동산 담보 있음</option>
      <option value="신용">담보 없음(신용)</option>
      <option value="사업자">사업자</option>
    </select>

    <!-- 봇 차단(허니팟): 사람은 보지 못하며, 채워지면 접수하지 않음 -->
    <div class="hp" aria-hidden="true">
      <label for="company_website">Company website</label>
      <input id="company_website" name="company_website" tabindex="-1" autocomplete="off">
    </div>

    <div class="consent">
      <input type="checkbox" id="consent" name="consent" required>
      <small><b>[필수] 개인정보 수집·이용 동의.</b> 상담 목적에 한해 <b>이름·연락처</b>를 수집하며,
      목적 달성 후 지체 없이 파기합니다. <b>주민등록번호는 수집하지 않습니다.</b></small>
    </div>

    <button type="submit" id="btn">상담 접수하기</button>
    <p class="err" id="err"></p>
    <p class="note">※ 대출은 심사 기준에 따라 한도 및 금리가 달라질 수 있으며, 대출 실행이 보장되는 것은 아닙니다.</p>

    <div class="brand">
      (주)더스틴홀딩스대부중개 · 정식등록업체<br>
      상담문의 010-4649-5078 · 카카오톡/텔레그램 상담 가능
    </div>
  </form>

<script>
  // 광고 링크의 유입 채널/캠페인 파라미터 수집 (전환추적)
  var q = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  var btn = document.getElementById('btn');
  var err = document.getElementById('err');

  function fail(msg){ err.textContent = msg; err.style.display = 'block'; }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    err.style.display = 'none';

    if (!f.consent.checked) { fail('개인정보 수집·이용에 동의해 주세요.'); return; }
    if (!f.name.value.trim()) { fail('이름을 입력해 주세요.'); return; }
    if (f.phone.value.replace(/[^0-9]/g, '').length < 9) { fail('연락처를 확인해 주세요.'); return; }

    btn.disabled = true; btn.textContent = '접수 중…';

    fetch('/api/intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: f.name.value.trim(),
        phone: f.phone.value.trim(),
        amount: f.amount.value.trim(),
        collateral: f.collateral.value,
        consent: f.consent.checked,
        company_website: f.company_website.value,   // 허니팟
        source_channel: q.get('channel') || '',
        utm: q.get('utm') || ''
      })
    })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.d && res.d.error ? res.d.error : '접수 실패');
      f.innerHTML = '<h1>접수 완료</h1>'
        + '<p class="sub">빠른 시일 내 연락드리겠습니다. 감사합니다.</p>'
        + '<div class="brand">(주)더스틴홀딩스대부중개 · 010-4649-5078</div>';
    })
    .catch(function (e2) {
      btn.disabled = false; btn.textContent = '상담 접수하기';
      fail(e2.message || '접수 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.');
    });
  });
</script>
</body>
</html>
